# Builds Capri.exe (the one-file app) and Capri-Setup-<version>.exe on GitHub's own Windows machine and publishes it as a release,
# whenever the version in capri/__init__.py changes on main (or when started by hand: Actions tab ->
# "Build and release" -> Run workflow). Capri's auto-update then offers it to everyone.
name: Build and release

on:
  push:
    branches: [main]
    paths: ["capri/__init__.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: v
        shell: pwsh
        run: |
          $v = (Select-String -Path capri/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Capri $v"

      - name: Already released?
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          if gh release view "v$v" >/dev/null 2>&1 || gh release view "$v" >/dev/null 2>&1; then
            echo "Capri $v is already released - nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.exists.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install what the build needs
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -r requirements-voice.txt
          python -m pip install --no-deps --ignore-requires-python "kokoro-onnx>=0.5,<1"
          python -m pip install "sherpa-onnx>=1.12"
          choco install innosetup --no-progress -y

      - name: Check Windows' sound mixer (her Discord "Vibing to music")
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        run: python tools/check_sound_mixer.py

      - name: Build Capri.exe
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/capri.spec

      - name: Build the installer
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=${{ steps.v.outputs.version }}" packaging\capri.iss
          Get-Item "dist\Capri-Setup-${{ steps.v.outputs.version }}.exe"

      - name: Build the one-file Capri.exe (Capri packed inside a small launcher)
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build, dist\portable | Out-Null
          Set-Content -NoNewline -Encoding ascii build\version.txt "${{ steps.v.outputs.version }}"
          python tools/pack_portable.py dist/Capri build/capri.zip
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /optimize+ /target:winexe `
            /out:dist\portable\Capri.exe /win32icon:assets\capri\app_icon.ico `
            /resource:build\capri.zip,capri.zip /resource:build\version.txt,version.txt `
            /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /r:System.Windows.Forms.dll `
            /r:System.Drawing.dll packaging\launcher\CapriLauncher.cs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Item dist\portable\Capri.exe

      - name: Check the one-file Capri.exe unpacks and starts her
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $p = Start-Process dist\portable\Capri.exe -ArgumentList "--extract-only" -Wait -PassThru
          if ($p.ExitCode) { Write-Error "unpacking failed ($($p.ExitCode))"; exit 1 }
          if (-not (Test-Path "$env:LOCALAPPDATA\Capri\app\$v\Capri\Capri.exe")) { Write-Error "not unpacked"; exit 1 }
          Start-Process dist\portable\Capri.exe
          $log = "$env:LOCALAPPDATA\Capri\capri.log"
          $ok = $false
          foreach ($i in 1..60) {
            Start-Sleep 1
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "one-file Capri.exe" -Quiet)) { $ok = $true; break }
          }
          Start-Sleep 8
          Get-Process Capri -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path $log) { Get-Content $log }
          if (-not $ok) { Write-Error "she didn't start from the one-file Capri.exe"; exit 1 }
          if (Select-String -Path $log -Pattern "Traceback" -Quiet) { Write-Error "she crashed"; exit 1 }

      - name: Describe it for Capri's updater (latest.json)
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $file = "Capri-Setup-$v.exe"
          $item = Get-Item "dist\$file"
          $hash = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLower()
          $one = Get-Item dist\portable\Capri.exe
          $oneHash = (Get-FileHash $one.FullName -Algorithm SHA256).Hash.ToLower()
          @{ version = $v; file = $file; size = $item.Length; sha256 = $hash
             portable = @{ file = "Capri.exe"; size = $one.Length; sha256 = $oneHash } } |
            ConvertTo-Json | Set-Content -Encoding utf8NoBOM dist\latest.json
          Get-Content dist\latest.json

      - name: Publish the release
        if: steps.exists.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          gh release create "v$v" dist/portable/Capri.exe "dist/Capri-Setup-$v.exe" dist/latest.json --target "$GITHUB_SHA" \
            --title "Capri $v" --notes-file packaging/release_notes.md

  linux:
    # Linux: the AppImage (one file, runs on most distros: Ubuntu 22.04+, Fedora, Arch, Mint, Debian 12...)
    needs: release
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: v
        run: echo "version=$(grep -oP '__version__ = "\K[^"]+' capri/__init__.py)" >> "$GITHUB_OUTPUT"

      - name: Already built?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          if ! gh release view "v$v" >/dev/null 2>&1; then
            echo "No release v$v yet (the Windows build makes it) - nothing to add to."; echo "skip=true" >> "$GITHUB_OUTPUT"
          elif gh release view "v$v" --json assets -q '.assets[].name' | grep -qx "Capri-x86_64.AppImage"; then
            echo "The AppImage is already there."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.exists.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install what the build needs
        if: steps.exists.outputs.skip != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libportaudio2 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-image0 libxcb-render-util0 libxcb-shape0 libxcb-randr0 libxcb-xinerama0 libxcb-xkb1 libegl1 \
            libfontconfig1 libdbus-1-3 xvfb jq
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install -r requirements-voice.txt
          python -m pip install --no-deps --ignore-requires-python "kokoro-onnx>=0.5,<1"
          python -m pip install "sherpa-onnx>=1.12" "python-xlib>=0.33"

      - name: Build Capri
        if: steps.exists.outputs.skip != 'true'
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/capri.spec

      - name: Check she starts (virtual screen, 20 s)
        if: steps.exists.outputs.skip != 'true'
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/cfg"
          xvfb-run -a -s "-screen 0 1600x900x24" timeout 20 dist/Capri/Capri || test $? -eq 124
          log="$XDG_CONFIG_HOME/Capri/capri.log"
          cat "$log"
          grep -q "starting" "$log"
          ! grep -q "Traceback" "$log"

      - name: Make the AppImage
        if: steps.exists.outputs.skip != 'true'
        run: bash packaging/build_appimage.sh

      - name: Add it to the release (and to latest.json for the updater)
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.v.outputs.version }}"
          f=dist/Capri-x86_64.AppImage
          size=$(stat -c %s "$f"); sha=$(sha256sum "$f" | cut -d' ' -f1)
          mkdir -p latest
          gh release download "v$v" -p latest.json -D latest --clobber || echo "{\"version\": \"$v\"}" > latest/latest.json
          jq --arg file "Capri-x86_64.AppImage" --argjson size "$size" --arg sha "$sha" \
            '.linux = {file: $file, size: $size, sha256: $sha}' latest/latest.json > dist/latest.json
          cat dist/latest.json
          gh release upload "v$v" "$f" dist/latest.json --clobber
